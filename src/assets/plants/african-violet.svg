<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="bgAV" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#f7f4fa"/>
      <stop offset="100%" stop-color="#e3d9eb"/>
    </radialGradient>
    <linearGradient id="potAV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7b1fa2"/>
      <stop offset="100%" stop-color="#4a148c"/>
    </linearGradient>
    <linearGradient id="leafAV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#558b2f"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    <radialGradient id="flowerAV" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e1bee7"/>
      <stop offset="100%" stop-color="#8e24aa"/>
    </radialGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bgAV)"/>
  <!-- small pot -->
  <ellipse cx="200" cy="320" rx="75" ry="14" fill="#3a0a5c"/>
  <path d="M130 320 Q200 340 270 320 L265 360 Q200 372 135 360 Z" fill="url(#potAV)"/>
  <!-- rosette of fuzzy leaves -->
  <g>
    <g fill="url(#leafAV)" stroke="#1b5e20" stroke-width="0.8">
      <ellipse cx="200" cy="280" rx="75" ry="22" transform="rotate(0 200 280)"/>
      <ellipse cx="200" cy="280" rx="75" ry="22" transform="rotate(45 200 280)"/>
      <ellipse cx="200" cy="280" rx="75" ry="22" transform="rotate(90 200 280)"/>
      <ellipse cx="200" cy="280" rx="75" ry="22" transform="rotate(135 200 280)"/>
    </g>
  </g>
  <!-- flowers (5 petals each) -->
  <g>
    <g transform="translate(200 250)">
      <circle r="14" fill="url(#flowerAV)"/>
      <circle r="14" fill="url(#flowerAV)" transform="rotate(72)"/>
      <circle r="14" fill="url(#flowerAV)" transform="rotate(144)"/>
      <circle r="14" fill="url(#flowerAV)" transform="rotate(216)"/>
      <circle r="14" fill="url(#flowerAV)" transform="rotate(288)"/>
      <circle r="4" fill="#fdd835"/>
    </g>
    <g transform="translate(165 245)">
      <circle r="11" fill="url(#flowerAV)"/>
      <circle r="11" fill="url(#flowerAV)" transform="rotate(72)"/>
      <circle r="11" fill="url(#flowerAV)" transform="rotate(144)"/>
      <circle r="11" fill="url(#flowerAV)" transform="rotate(216)"/>
      <circle r="11" fill="url(#flowerAV)" transform="rotate(288)"/>
      <circle r="3" fill="#fdd835"/>
    </g>
    <g transform="translate(235 248)">
      <circle r="11" fill="url(#flowerAV)"/>
      <circle r="11" fill="url(#flowerAV)" transform="rotate(72)"/>
      <circle r="11" fill="url(#flowerAV)" transform="rotate(144)"/>
      <circle r="11" fill="url(#flowerAV)" transform="rotate(216)"/>
      <circle r="11" fill="url(#flowerAV)" transform="rotate(288)"/>
      <circle r="3" fill="#fdd835"/>
    </g>
  </g>
</svg>