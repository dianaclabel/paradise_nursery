  </defs>
  <rect width="400" height="400" fill="url(#bgPothos)"/>
  <!-- pot -->
  <path d="M150 270 Q200 300 250 270 L258 360 Q258 380 240 380 L160 380 Q142 380 142 360 Z" fill="url(#potPothos)"/>
  <ellipse cx="200" cy="270" rx="55" ry="10" fill="#5d4037"/>
