<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="bgPothos" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#f7faf4"/>
      <stop offset="100%" stop-color="#dde9d4"/>
    </radialGradient>
    <linearGradient id="potPothos" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d7ccc8"/>
      <stop offset="100%" stop-color="#8d6e63"/>
    </linearGradient>
    <linearGradient id="leafPothosDark" x1="0" y1="0" x2="0" y2="1">
