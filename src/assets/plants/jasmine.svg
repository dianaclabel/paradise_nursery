<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="bgJas" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#fafaf2"/>
      <stop offset="100%" stop-color="#e2e6c8"/>
    </radialGradient>
    <linearGradient id="potJas" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bcaaa4"/>
      <stop offset="100%" stop-color="#795548"/>
    </linearGradient>
    <linearGradient id="leafJas" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#558b2f"/>
      <stop offset="100%" stop-color="#33691e"/>
    </linearGradient>
    <radialGradient id="flowerJas" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fff59d"/>
    </radialGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bgJas)"/>
  <!-- pot -->
  <path d="M140 280 Q200 320 260 280 L268 360 Q268 380 248 380 L152 380 Q132 380 132 360 Z" fill="url(#potJas)"/>
  <ellipse cx="200" cy="280" rx="60" ry="12" fill="#4e342e"/>
  <!-- vines -->
  <g stroke="#33691e" stroke-width="2.5" fill="none">
    <path d="M180 280 Q170 220 150 150 Q140 110 160 80"/>
    <path d="M220 280 Q230 220 250 150 Q260 110 240 80"/>
    <path d="M200 280 Q200 200 200 110"/>
  </g>
  <!-- leaves (trifoliate) -->
  <g fill="url(#leafJas)">
    <g><ellipse cx="160" cy="220" rx="10" ry="6" transform="rotate(-30 160 220)"/><ellipse cx="155" cy="210" rx="10" ry="6" transform="rotate(-50 155 210)"/><ellipse cx="170" cy="210" rx="10" ry="6" transform="rotate(-10 170 210)"/></g>
    <g><ellipse cx="155" cy="170" rx="10" ry="6" transform="rotate(-30 155 170)"/><ellipse cx="150" cy="160" rx="10" ry="6" transform="rotate(-50 150 160)"/><ellipse cx="165" cy="160" rx="10" ry="6" transform="rotate(-10 165 160)"/></g>
    <g><ellipse cx="240" cy="220" rx="10" ry="6" transform="rotate(30 240 220)"/><ellipse cx="245" cy="210" rx="10" ry="6" transform="rotate(50 245 210)"/><ellipse cx="230" cy="210" rx="10" ry="6" transform="rotate(10 230 210)"/></g>
    <g><ellipse cx="245" cy="170" rx="10" ry="6" transform="rotate(30 245 170)"/><ellipse cx="250" cy="160" rx="10" ry="6" transform="rotate(50 250 160)"/><ellipse cx="235" cy="160" rx="10" ry="6" transform="rotate(10 235 160)"/></g>
    <g><ellipse cx="195" cy="200" rx="10" ry="6"/><ellipse cx="185" cy="190" rx="10" ry="6" transform="rotate(-50 185 190)"/><ellipse cx="215" cy="190" rx="10" ry="6" transform="rotate(50 215 190)"/></g>
    <g><ellipse cx="200" cy="150" rx="10" ry="6"/><ellipse cx="190" cy="140" rx="10" ry="6" transform="rotate(-50 190 140)"/><ellipse cx="210" cy="140" rx="10" ry="6" transform="rotate(50 210 140)"/></g>
  </g>
  <!-- white jasmine flowers (5-petal) -->
  <g>
    <g transform="translate(170 120)">
      <circle r="14" fill="url(#flowerJas)"/>
      <circle r="14" fill="url(#flowerJas)" transform="rotate(72)"/>
      <circle r="14" fill="url(#flowerJas)" transform="rotate(144)"/>
      <circle r="14" fill="url(#flowerJas)" transform="rotate(216)"/>
      <circle r="14" fill="url(#flowerJas)" transform="rotate(288)"/>
      <circle r="4" fill="#fdd835"/>
    </g>
    <g transform="translate(230 110)">
      <circle r="12" fill="url(#flowerJas)"/>
      <circle r="12" fill="url(#flowerJas)" transform="rotate(72)"/>
      <circle r="12" fill="url(#flowerJas)" transform="rotate(144)"/>
      <circle r="12" fill="url(#flowerJas)" transform="rotate(216)"/>
      <circle r="12" fill="url(#flowerJas)" transform="rotate(288)"/>
      <circle r="3" fill="#fdd835"/>
    </g>
    <g transform="translate(200 90)">
      <circle r="10" fill="url(#flowerJas)"/>
      <circle r="10" fill="url(#flowerJas)" transform="rotate(72)"/>
      <circle r="10" fill="url(#flowerJas)" transform="rotate(144)"/>
      <circle r="10" fill="url(#flowerJas)" transform="rotate(216)"/>
      <circle r="10" fill="url(#flowerJas)" transform="rotate(288)"/>
      <circle r="3" fill="#fdd835"/>
    </g>
  </g>
</svg>